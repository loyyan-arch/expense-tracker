name: expense-tracker

services:
  api:
    image: expense-tracker:1.0.0
    build: .

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/expenses.db

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - expense_data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  expense_data: